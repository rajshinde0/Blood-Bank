services:
  web:
    build: .
    container_name: blood-bank-web
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      FLASK_APP: app.py
      DATABASE_URL: sqlite:////app/instance/blood_bank.db
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in your environment or a .env file}
      LOG_LEVEL: INFO
      SESSION_TIMEOUT: 3600
    volumes:
      - ./data:/app/data:ro          # seed CSVs for migrate_csv_to_db.py
      - blood-bank-db:/app/instance  # SQLite database
      - ./logs:/app/logs
    networks:
      - blood-bank-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # To run on PostgreSQL instead of SQLite, uncomment this service, add
  # `psycopg2-binary` to requirements.txt, and point DATABASE_URL above at
  # postgresql://blood_user:${DB_PASSWORD}@db:5432/blood_bank
  #
  # db:
  #   image: postgres:16-alpine
  #   container_name: blood-bank-db
  #   environment:
  #     POSTGRES_DB: blood_bank
  #     POSTGRES_USER: blood_user
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - blood-bank-network
  #   restart: unless-stopped

networks:
  blood-bank-network:
    driver: bridge

volumes:
  blood-bank-db:
  # postgres_data:

