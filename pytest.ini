[pytest]
testpaths = .
python_files = test_*.py
addopts = -v --strict-markers

# Datetimes are timezone-aware UTC throughout (models.UTCDateTime), so the
# utcnow() deprecation no longer needs suppressing. Fail on any new one.
filterwarnings =
    error::DeprecationWarning:app
    error::DeprecationWarning:models
    error::DeprecationWarning:utils
