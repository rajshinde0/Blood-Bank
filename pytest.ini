[pytest]
testpaths = .
python_files = test_*.py
addopts = -v --strict-markers

# models.py and app.py still use datetime.utcnow() for column defaults and
# elapsed-time maths. Migrating to timezone-aware datetimes is worthwhile but
# has to be done in one sweep - SQLite hands back naive values, so a partial
# migration would mix aware and naive datetimes and break the subtractions in
# Patient.wait_time_minutes and utils.get_time_remaining.
filterwarnings =
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
